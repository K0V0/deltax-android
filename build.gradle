plugins {
    id 'com.android.application' version '8.13.2'
}

android {
    namespace 'com.example.xdelta'
    compileSdk 36

    defaultConfig {
        applicationId 'com.example.xdelta'
        minSdk 21
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    // The project keeps the old Eclipse/ADT layout instead of src/main/java,
    // so point the main source set at the existing directories.
    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-project.txt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
